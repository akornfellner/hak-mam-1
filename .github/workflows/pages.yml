# Veröffentlicht Skript (HTML) und Folien bei jedem Push auf main auf GitHub Pages.
# Der Ablauf selbst steht im gemeinsamen Workflow im Repo hak-quarto und wird
# nur dort geändert. Lokal nachstellen: just online
#
# Einmalig im Repository einstellen:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Skript und Folien auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Die Rechte muss dieser Workflow vergeben, der aufgerufene kann sie nicht erweitern
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  seite:
    uses: akornfellner/hak-quarto/.github/workflows/pages.yml@main
