# Rendert das Skript als HTML und veröffentlicht es auf GitHub Pages.
# PDF und Folien werden hier bewusst nicht erzeugt.
#
# Einmalig im Repository einstellen:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Skript auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung gleichzeitig; laufende nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Quarto installieren
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Skript als HTML rendern
        run: quarto render --to html

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: HTML hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
