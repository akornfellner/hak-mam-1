# Profil für die Folien (revealjs)
# Rendern mit: quarto render --profile folien
#
# Ein Quarto-Buch kann keine Folien erzeugen. Dieses Profil schaltet deshalb auf
# eine Webseite um und rendert nur die Foliendateien (folien-N.qmd) und die
# Übersichtsseite (folien-uebersicht.qmd → _folien/index.html).
#
# Der Projekttyp muss "website" sein (nicht "default"): Nur dann bindet Quarto
# das Logo aus der Extension mit relativem Pfad ein. Sonst fehlt es, sobald die
# Folien in einem Unterordner liegen (GitHub Pages: /<repo>/folien/).
#
# Folien-Einstellungen für alle Klassen stehen in der Extension (hak-revealjs).

project:
  type: website
  output-dir: _folien
  render:
    - folien-uebersicht.qmd
    - "*/folien-*.qmd"

# Untertitel aller Folien und der Übersichtsseite (Fach und Klasse)
subtitle: "Mathematik und angewandte Mathematik – 1. Klasse HAK"
