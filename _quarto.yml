project:
  type: book
  output-dir: _book
  # Python-Code läuft im Projektordner, damit "from _python.grafiken import *" klappt
  execute-dir: project

lang: de

book:
  title: "Mathematik und angewandte Mathematik"
  subtitle: "HAK – 1. Klasse"
  author: "Alexander Kornfellner"
  # Link zur Übersichtsseite der Folien (nur online vorhanden: der Workflow
  # kopiert die Folien nach _book/folien/, lokal siehe "just online")
  navbar:
    right:
      - text: "Folien"
        icon: easel
        href: folien/index.html
  chapters:
    - index.qmd
    - 01-zahlen-und-mengen/kapitel-1.qmd

number-depth: 2

# Python-Code (matplotlib-Grafiken) wird nie angezeigt, nur das Ergebnis
jupyter: python3
execute:
  echo: false
  warning: false

# Kurzbefehle, z. B. {{< buch 1.23 1.24ab >}} für Buchbeispiele
shortcodes:
  - _shortcodes/buch.lua

filters:
  - _filters/pdf-nummerierung.lua
  - _filters/deutsche-anfuehrungszeichen.lua
  - _filters/intervallklammern.lua
  - _filters/dezimalkomma.lua

format:
  html:
    # Umschalter hell/dunkel; "brand" zuletzt, damit _brand.yml Vorrang hat
    theme:
      light: [cosmo, brand]
      dark: [darkly, brand]
    css: _includes/buchbeispiele.css
    toc: true
  typst:
    papersize: a4
    toc: true
    toc-depth: 2
    include-before-body: _includes/typst-anpassungen.typ
