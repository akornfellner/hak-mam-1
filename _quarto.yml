# Buchprojekt des Skripts (HTML + PDF).
# Design, Filter, Kurzbefehle und Format-Einstellungen kommen aus der Extension
# in _extensions/hak/ (Repo hak-quarto). Hier steht nur, was zu diesem Skript gehört.

project:
  type: book
  output-dir: _book
  # Python-Code läuft im Projektordner, damit "from _python.grafiken import *" klappt
  execute-dir: project

book:
  title: "Mathematik und angewandte Mathematik"
  subtitle: "HAK – 1. Klasse"
  author: "Alexander Kornfellner"
  # Link zur Übersichtsseite der Folien (nur online vorhanden: der Workflow
  # kopiert die Folien nach _book/folien/, lokal siehe "just online")
  navbar:
    right:
      - text: "Folien"
        icon: easel
        href: folien/index.html
  chapters:
    - index.qmd
    - 01-zahlen-und-mengen/kapitel-1.qmd

# Einstellungen für das PDF (das PDF verwendet "typst", nicht "hak-typst",
# sonst ginge die Buchvorlage verloren)
metadata-files:
  - _extensions/hak/pdf.yml

format:
  hak-html: default
  typst: default
