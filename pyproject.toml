# Python-Umgebung für die matplotlib-Grafiken im Skript.
# Einrichten und aktualisieren: uv sync
[project]
name = "hak-mam-1"
version = "0.1.0"
description = "Mathematik-Skript HAK/HAS Eferding, 1. Klasse"
requires-python = ">=3.10"
# Nur was Quarto zum Rendern braucht (auch auf GitHub)
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
# Werkzeuge zum Arbeiten am Rechner, auf GitHub nicht nötig (uv sync --no-dev)
dev = [
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.5",
    "pandas>=2.3.3",
]

[tool.uv]
# Das Skript ist kein Python-Paket, uv installiert nur die Abhängigkeiten
package = false
